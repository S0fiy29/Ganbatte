<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mixed Games 2</title>
  <link rel="stylesheet" href="../katakana/button.css">
  
  <style>
    * {
      box-sizing: border-box;
    }
    body {

      background-color: #f5f5f5;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h1, h2 {
      margin: 0;
      text-align: center;
      margin-bottom: 10px; /* Add margin to create space between h2 and the following elements */
    }

    .logo {
    position: absolute;
    top: 0px;
    left: 10px;
    margin-left: 40px;
    }
    
    .score-container {
      background-color: #3498db;
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 1.5em;
      margin-top: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px; /* Add margin to create space between score-container and the following elements */
    }
    .box-container {
      background: #ffffff;
      padding: 1em;
      display: inline-block;
      vertical-align: top;
      margin-bottom: 20px; /* Add margin to create space between box-container and the following elements */
    }
    .box {
  display: inline-block;
  vertical-align: top;
  width: 60px;
  height: 60px;
  background: #989BC9;
  color: #fff;
  font-size: 2em;
  text-align: center;
  transition: transform 0.15s ease;
  border-radius: 50%;
  padding-top: 0.3em;
  margin-right: 10px; /* Add margin to create space between boxes */
}

.box.even {
  margin-right: 0; /* Remove margin from the last even box to avoid unnecessary space */
}

    .box:last-child {
      margin-right: 0; /* Remove margin from the last box to avoid unnecessary space */
    }
    .box.ui-draggable-dragging {
      box-shadow: 10px 20px 30px rgba(0,0,0,0.5);
      transform: scale(2);
    }
    .droparea {
      background: #FFC0CB;
      width: 800px;
      height: 300px;
      display: inline-block;
      vertical-align: top;
      text-align: center;
      margin-bottom: 20px; /* Add margin to create space between droparea and the following elements */
    }

    img{
        border-radius: 10px;
    }

    .correct {
      background-color: #8fda8f !important;
    }

    .incorrect {
      background-color: #f58a8a !important;
    }

    #notification {
      display: none;
      padding: 10px;
      margin-top: 20px;
      border-radius: 5px;
    }

    #notification.correct {
      background-color: #8fda8f;
    }

    #notification.incorrect {
      background-color: #f58a8a;
    }

    #seterusnyaButton {
      display: none;
      margin-top: 20px;
    }

    #tableButton{
      margin-top: 20px;
    }

    .back-btn {
    margin: 25px 10px 10px 10px;
    }
  </style>
</head>

<body>

    <a href="mixedGamesMenu2.html">
        <img class="logo" src="../img/logoWI.png" alt="image" width="200" height="200">
    </a>
    
  <h2>BINA PERKATAAN INI</h2>

  <!-- partial:index.partial.html -->
  <div class="box-container">
    <div class="box even" data-numtype="even">ミ	</div>
    <div class="box odd" data-numtype="odd">ケ</div>
    <div class="box even" data-numtype="even">ル</div>
    <div class="box odd" data-numtype="odd">メ</div>
    <div class="box even" data-numtype="even">ク</div>
    <div class="box odd" data-numtype="odd">レ</div>
  </div>


  <!--Change droparea to accept odd or even-->
  <div class="droparea" data-area-numtype="even">
    <h2>Miruku (Susu)</u></h2>
    <img src="images/miruku.jpeg" alt="miruku" height="200px" width="200px">
  </div>

  <button id="seterusnyaButton" class="custom-btn btn-16" onclick="window.location.href='MGgame4.html'">SETERUSNYA</button>
  <button id="tableButton" class="custom-btn btn-16" onclick="window.location.href='MGHiraganaTable.html'">LIHAT CARTA</button>

  <!-- partial -->

  <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js'></script>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js'></script>
  <!--<script src="./script.js"></script>-->

<script>
  $(document).ready(function(){
  
  // Vars
  var score = 0;
  var numBoxesDropped = 0;
  var numBoxes = $('.box').length;
  var gameFinished = false; // track whether the game has finished

  
  // Creat sounds
  var correctSound = document.createElement('audio');
   correctSound.setAttribute('src', 'https://opengameart.org/sites/default/files/correct_sound_effect_1.mp3');
  
  var errorSound = document.createElement('audio');
  errorSound.setAttribute('src', 'https://soundboardguy.com/wp-content/uploads/2021/07/spongebob-fail.mp3');
      
  
  // make boxes draggable
  $('.box').draggable({
    revert: true
  });
  
  // make doparea droppable
  $('.droparea').droppable({
    accept : '.box',
    drop : handleBoxDrop
  });
  
  // function that handles the box being droppped
  function handleBoxDrop(event, ui){
    
    //If game finished, pop up once only
    if(gameFinished){return;}
    
    // Vars
    var box = ui.draggable;    
    var boxNumType = box.attr('data-numtype');
    var dropArea = $(this);
    var dropAreaNumType = dropArea.attr('data-area-numtype');
    
    // Check if box number type matches number type of drop area
    if( boxNumType == dropAreaNumType ){
      // num type matches!
      box.addClass('correct');
      correctSound.play();
      score++;
    }else{
      // num type does NOT match!
      box.addClass('incorrect');
      errorSound.play();
    }
    
    // disable dragging
    box.draggable('disable').draggable('option', 'revert', false);
    numBoxesDropped++;

    console.log(numBoxesDropped);
    
    // output score
    $('#score').text(score);
    
    // Check if all boxes of the specified type are dropped in the correct drop area
    var allBoxesDropped = $('.box[data-numtype="' + dropAreaNumType + '"]').length === $('.box.correct[data-numtype="' + dropAreaNumType + '"]').length;    
    if (allBoxesDropped) {
        alert("Anda Betul! Teruskan Ke Game Seterusnya");
        // game finish
        gameFinished = true;
        
        //dsiplay SETERUSNYA
        var seterusnyabtn = document.getElementById('seterusnyaButton');
        var carta = document.getElementById('tableButton');
        seterusnyabtn.style.display = 'block';
        carta.style.display = 'none';
    }

    // Delay before enabling dragging within the drop area
    setTimeout(function () {
        // Enable dragging within the drop area and set containment
        box.draggable('option', {
            disabled: false,
            revert: false,
            containment: [dropArea.offset().left, dropArea.offset().top, dropArea.offset().left + dropArea.width() - box.width(), dropArea.offset().top + dropArea.height() - box.height()]
        });
    }, 500); // Adjust the duration as needed (in milliseconds)
  }
});

</script>
</body>
</html>
