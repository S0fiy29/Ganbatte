<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katakana Introduction</title>
  <link rel="stylesheet" href="button.css">

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h1, h2 {
      margin: 0;
      text-align: center;
      margin-bottom: 10px; /* Add margin to create space between h2 and the following elements */
    }
    .score-container {
      background-color: #3498db;
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 1.5em;
      margin-top: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px; /* Add margin to create space between score-container and the following elements */
    }
    .box-container {
      background: #ccc;
      padding: 1em;
      display: inline-block;
      vertical-align: top;
      margin-bottom: 20px; /* Add margin to create space between box-container and the following elements */
    }
    .box {
  display: inline-block;
  vertical-align: top;
  width: 60px;
  height: 60px;
  background: #000;
  color: #fff;
  font-size: 2em;
  text-align: center;
  transition: transform 0.15s ease;
  border-radius: 50%;
  padding-top: 0.3em;
  margin-right: 10px; /* Add margin to create space between boxes */
}

.box.even {
  margin-right: 0; /* Remove margin from the last even box to avoid unnecessary space */
}

    .box:last-child {
      margin-right: 0; /* Remove margin from the last box to avoid unnecessary space */
    }
    .box.correct {
      background: green;
    }
    .box.incorrect {
      background: red;
    }
    .box.ui-draggable-dragging {
      box-shadow: 10px 20px 30px rgba(0,0,0,0.5);
      transform: scale(2);
    }
    .droparea {
      background: yellow;
      width: 400px;
      height: 200px;
      display: inline-block;
      vertical-align: top;
      text-align: center;
      margin-bottom: 20px; /* Add margin to create space between droparea and the following elements */
    }
  </style>
</head>

<body>

  <img class="logo" src="/img/logoWI.png" alt="image" width="200" height="200">
  <br><br><br>
  <h1 style="margin-top: 0;">PERMAINAN</h1>
  
  <h2>BUNYI APAKAH INI?</h2>

  <div class="score-container">
    Score: <span id="score">0</span>
  </div>

  <!-- partial:index.partial.html -->
  <div class="box-container">
    <div class="box odd" data-numtype="odd">1</div>
    <div class="box even" data-numtype="even">2</div>
    <div class="box odd" data-numtype="odd">3</div>
    <div class="box even" data-numtype="even">4</div>
    <div class="box odd" data-numtype="odd">5</div>
    <div class="box even" data-numtype="even">6</div>
  </div>

  <div class="droparea" data-area-numtype="odd">
    <h2>Terebi word</u></h2>
    <img src="img/TV.png" alt="terebi" height="100px" width="100px">
    
  </div>

  <div class="droparea" data-area-numtype="even">
    <h2>Drop <u>even</u> boxes here</h2>
  </div>
  <!-- partial -->

  <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js'></script>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js'></script>
  <script src="./script.js"></script>




<script>
  $(document).ready(function(){
  
  // Vars
  var score = 0;
  var numBoxesDropped = 0;
  var numBoxes = $('.box').length;

  
  // Creat sounds
  var correctSound = document.createElement('audio');
   correctSound.setAttribute('src', 'http://www.orangefreesounds.com/wp-content/uploads/2017/06/Ting-sound-effect.mp3');
  
  var errorSound = document.createElement('audio');
  errorSound.setAttribute('src', 'http://soundbible.com/mp3/Buzz-SoundBible.com-1790490578.mp3');
      
  
  // make boxes draggable
  $('.box').draggable({
    revert: true
  });
  
  // make doparea droppable
  $('.droparea').droppable({
    accept : '.box',
    drop : handleBoxDrop
  });
  
  // function that handles the box being droppped
  function handleBoxDrop(event, ui){
    // Vars
    var box = ui.draggable;    
    var boxNumType = box.attr('data-numtype');
    var dropArea = $(this);
    var dropAreaNumType = dropArea.attr('data-area-numtype');
    
    // Check if box number type matches number type of drop area
    if( boxNumType == dropAreaNumType ){
      // num type matches!
      box.addClass('correct');
      correctSound.play();
      score++;
    }else{
      // num type does NOT match!
      box.addClass('incorrect');
      errorSound.play();
    }
    
    // disable dragging
    box.draggable('disable').draggable('option', 'revert', false);
    numBoxesDropped++;
    console.log(numBoxesDropped);
    
    // output score
    $('#score').text(score);
    
    // check if game has ended
    if(numBoxesDropped == numBoxes){
      // game finished!
      alert("game finished!");
    }
  }
  
});

</script>

</body>
</html>
