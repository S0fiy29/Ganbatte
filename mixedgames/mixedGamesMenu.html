<!DOCTYPE html>
<html lang="en">

<head>
  <title>Main Page</title>
  <style>
    body {
      background-color: #989BC9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      flex-direction: column; /* Align items vertically */
      position: relative; /* Make body a positioned container for absolute positioning */
    }

    .button-container {
      text-align: center;
      z-index: 1; /* Ensure buttons are above the logo */
    }

    .custom-btn {
      margin-bottom: 10px; /* Add some bottom margin for separation */
    }

    .flower-container {
      position: absolute;
      bottom: 0;
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    .flower-container img {
      margin-bottom: 10px; /* Add some bottom margin for separation */
    }

    .logo {
      position: absolute;
      top: 0px;
      left: 10px;
      padding-left: 40px;
    }
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Chewy&display=swap">
  <link rel="stylesheet" href="../CSS/button.css">
</head>

<body>

  <audio id="backgroundAudio" autoplay>
    <source src="../audio/backsong.mp3" type="audio/mp3">
    Your browser does not support the audio element.
</audio>

  <!-- image logo -->
  <img class="logo" src="../img/logoWI.png" alt="image" width="200" height="200">

  <div class="button-container">

    <button class="custom-btn btn-2" onclick="goBack()">KEMBALI</button>
    <br>
    <button class="custom-btn btn-3" onclick="window.location.href='MGgame1.html'">GAME 1</button>
    <br>
    <button class="custom-btn btn-3" onclick="window.location.href='MGgame3.html'">GAME 2</button>
    <br>
    <button class="custom-btn btn-3" onclick="window.location.href='MGgame6.html'">GAME 3</button>
  </div>

  <div class="flower-container">
    <img src="../img/flowerR.png" alt="image" width="300" height="300">
    <img src="../img/flowerL.png" alt="image" width="300" height="300">
  </div>

  <script>
    // JavaScript function to go back
    function goBack() {
      window.history.back();
    }
</script>

</body>

</html>
